<!DOCTYPE html>
<html lang="es">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio de Sesión</title>
    <link rel="stylesheet" href="iniciar_sesion.css">
</head>
<body>

    <div class="login-container">

        <form>

        <div class="separador-o">
            <span>O</span>
        </div>
    </form>
