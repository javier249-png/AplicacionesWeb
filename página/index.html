<!DOCTYPE html>
<html lang="sp">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="estilo/estilo.css">
    <title id="color_titulo">club penguin</title>
</head>

<body>
    <form class="formulario" name="f1" action="#" method="POST">
        <h2>Registro de cliente</h2>
        <div class="campo">
            <label for="nombre">Nombre</label>
            <input type="text" name="carrera" size="50" maxlength="10" required
                placeholder="Escriba su nombre completo">
        </div>
        <div class="campo">
            <label for="apellido">Apellido</label>
            <input type="text" id="apellido" name="apellido">
        </div>
        <div class="campo">
            <label for="correo">Correo</label>
            <input type="email" id="correo" name="correo" size="20" maxlength="20" placeholder="ej: ejemplo@gmail.com">
        </div>
        <div class="campo">
            <label for="telefono">Teléfono</label>
            <input type="number" id="tel" name="tel" min="17" max="23">
        </div>
        <div class="campo">
            <label for="region">Región</label>
            <select name="region" id="region">
                <option value="">Seleccione una región</option>
                <option value="biobio">Biobío</option>
                <option value="nuble">Ñuble</option>
                <option value="araucania">Araucanía</option>
            </select>
        </div>
        <div class="campo">
            <label for="fecha">Fecha de nacimiento</label>
            <imput type="date" id="fecha" name="fecha">
        </div>
        <div class="campo campo-ancho">
            <label for="observaciones">Observaciones</label>
            <textarea name="observaciones" id="observaciones" rows="4"></textarea>
        </div>
        <div class="acciones">
            <button type="submit">Guardar</button>
        </div>
    </form>

</body>

</html>
